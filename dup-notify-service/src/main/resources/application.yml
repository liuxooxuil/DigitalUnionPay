# 通知服务 notify-service。站内信、短信、邮件和 App Push 从这里发出。端口 8085。
spring:
  application:
    name: notify-service
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/digital_union_pay?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
server:
  port: 8085
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  pattern:
    level: "%5p [trace:%X{X-Trace-Id:-}]"
---
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - classpath:digitalunionpay-nacos.yml
      - optional:nacos:notify-service.yaml
  cloud:
    function:
      definition: domainEventConsumer
    stream:
      bindings:
        domainEventConsumer-in-0:
          destination: digitalunionpay-domain-events
          group: notify-service
          content-type: application/json
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:digital_union_pay;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    sentinel:
      enabled: false
    stream:
      function:
        autodetect: false
seata:
  enabled: false
management:
  health:
    rocketmq:
      enabled: false
dup:
  auth:
    enabled: false
