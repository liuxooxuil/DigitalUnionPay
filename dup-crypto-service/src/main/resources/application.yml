# 加密资产服务 crypto-service。地址和托管签名在这里，客户余额通过 HTTP 调用清结算。端口 8089。
spring:
  application:
    name: crypto-service
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/digital_union_pay?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8089
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  pattern:
    level: "%5p [trace:%X{X-Trace-Id:-}]"
---
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - classpath:digitalunionpay-nacos.yml
      - optional:nacos:crypto-service.yaml
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:digital_union_pay;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    sentinel:
      enabled: false
    stream:
      function:
        autodetect: false
seata:
  enabled: false
management:
  health:
    rocketmq:
      enabled: false
dup:
  auth:
    enabled: false
