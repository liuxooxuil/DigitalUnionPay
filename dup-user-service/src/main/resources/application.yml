# 用户服务 user-service。注册、会话、RBAC、KYC 和继承在这里，资金变动不在这个进程里。端口 8081。
spring:
  application:
    name: user-service
  flyway:
    table: flyway_user_service
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/digital_union_pay?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
server:
  port: 8081
dup:
  auth:
    idle-hours: ${DUP_AUTH_IDLE_HOURS:2}
    session-hours: ${DUP_AUTH_SESSION_HOURS:12}
    max-devices: ${DUP_AUTH_MAX_DEVICES:5}
    sms-minutes: ${DUP_AUTH_SMS_MINUTES:5}
    email-minutes: ${DUP_AUTH_EMAIL_MINUTES:10}
    sms-daily-limit: ${DUP_AUTH_SMS_DAILY_LIMIT:10}
    register-ip-limit: ${DUP_AUTH_REGISTER_IP_LIMIT:5}
    lock-failures: ${DUP_AUTH_LOCK_FAILURES:5}
    lock-minutes: ${DUP_AUTH_LOCK_MINUTES:30}
  kyc:
    dir: ${DUP_KYC_DIR:}
    pass-threshold: ${DUP_KYC_PASS_THRESHOLD:80}
    rfi-days: ${DUP_KYC_RFI_DAYS:7}
    liveness-secret: "${DUP_KYC_LIVENESS_SECRET:DigitalUnionPayLivenessKey!!!!}"
  airwallex:
    base-url: ${AIRWALLEX_BASE_URL:}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
logging:
  pattern:
    level: "%5p [trace:%X{X-Trace-Id:-}]"
---
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - classpath:digitalunionpay-nacos.yml
      - optional:nacos:user-service.yaml
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:digital_union_pay;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    sentinel:
      enabled: false
    stream:
      function:
        autodetect: false
seata:
  enabled: false
management:
  health:
    rocketmq:
      enabled: false
dup:
  auth:
    enabled: false
  service-auth:
    enabled: false
  outbox:
    publish: false
